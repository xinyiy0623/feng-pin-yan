
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鳳品宴｜店家資訊與聯絡我們</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 15px;
  background: #080808;
  color: #e99a45;
  font-family: "Noto Sans TC", sans-serif;
}

.container {
  max-width: 750px;
  margin: auto;
}

/* 共用區塊 */
.section {
  width: 100%;
  background: #111111;
  border: 1px solid #9b5b24;
  padding: 35px 25px;
  margin-bottom: 28px;
  text-align: center;
  border-radius: 8px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}

.english-title {
  color: #c97932;
  letter-spacing: 5px;
  font-size: 13px;
}

h1, h2, h3 {
  color: #f2a04a;
}

h1 {
  font-size: 34px;
  letter-spacing: 6px;
}

h2 {
  font-size: 27px;
  letter-spacing: 4px;
}

.divider {
  width: 55px;
  height: 2px;
  background: #d77b2d;
  margin: 18px auto 25px;
}

p {
  color: #e99a45;
  line-height: 2;
}

/* 店家資訊 */
.store-info {
  font-size: 16px;
  line-height: 2.2;
}

.map-button {
  display: inline-block;
  margin-top: 20px;
  padding: 13px 30px;
  background: #d87929;
  color: #080808;
  text-decoration: none;
  font-weight: bold;
  letter-spacing: 2px;
  border-radius: 4px;
}

.map-button:hover {
  background: #f2a04a;
}

/* 聯絡表單 */
form {
  width: 100%;
  text-align: left;
  margin-top: 25px;
}

label {
  display: block;
  color: #f2a04a;
  margin-bottom: 8px;
  font-size: 15px;
}

input, textarea {
  width: 100%;
  padding: 14px;
  margin-bottom: 20px;
  background: #080808;
  color: #f2a04a;
  border: 1px solid #9b5b24;
  border-radius: 5px;
  font-size: 15px;
  outline: none;
}

input::placeholder,
textarea::placeholder {
  color: #a87548;
}

input:focus,
textarea:focus {
  border-color: #f2a04a;
  box-shadow: 0 0 5px rgba(242,160,74,0.35);
}

textarea {
  resize: vertical;
}

.submit-button {
  width: 100%;
  padding: 15px;
  background: #d87929;
  color: #080808;
  border: none;
  border-radius: 5px;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 4px;
  cursor: pointer;
}

.submit-button:hover {
  background: #f2a04a;
}

.small-note {
  font-size: 12px;
  color: #bd854d;
  margin-top: 18px;
}

@media(max-width:500px) {
  body {
    padding: 15px 10px;
  }

  .section {
    padding: 28px 18px;
  }

  h1 {
    font-size: 29px;
  }

  h2 {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- 上方：店家資訊 -->
  <section class="section">

    <p class="english-title">VISIT US</p>

    <h1>鳳品宴</h1>

    <div class="divider"></div>

    <h2>店家資訊</h2>

    <div class="store-info">

      <p>
        <strong>門市地址</strong><br>
        新北市土城區中華路一段247號
      </p>

      <p>
        <strong>聯絡電話</strong><br>
        0989-979-487
      </p>

      <p>
        歡迎蒞臨品味屏東泰國蝦的鮮美滋味。<br>
        本店沒有專屬停車位，請自行尋找附近停車場。
      </p>

    </div>

    <a class="map-button"
       href="https://www.google.com/maps/search/?api=1&query=新北市土城區中華路一段247號"
       target="_blank">
       Google Maps 導航
    </a>

  </section>


  <!-- 下方：聯絡表單 -->
  <section class="section">

    <p class="english-title">CONTACT US</p>

    <h2>聯絡我們</h2>

    <div class="divider"></div>

    <p>
      有任何問題、用餐諮詢或商品詢問，<br>
      歡迎填寫以下表單，我們將盡快與您聯絡。
    </p>

    <form action="https://formspree.io/f/xjyyzklp"
          method="POST">

      <label for="name">姓名 NAME</label>
      <input
        id="name"
        type="text"
        name="name"
        required
        placeholder="請輸入您的姓名">

      <label for="phone">電話 PHONE</label>
      <input
        id="phone"
        type="tel"
        name="phone"
        required
        placeholder="請輸入您的聯絡電話">

      <label for="email">電子信箱 EMAIL</label>
      <input
        id="email"
        type="email"
        name="email"
        required
        placeholder="example@email.com">

      <label for="message">聯絡事項 MESSAGE</label>
      <textarea
        id="message"
        name="message"
        rows="5"
        required
        placeholder="請輸入訂位人數、餐點諮詢或其他問題..."></textarea>

      <button type="submit" class="submit-button">
        送出聯絡表單
      </button>

    </form>

    <p class="small-note">
      您提供的資料僅供鳳品宴聯絡及回覆詢問使用。
    </p>

  </section>

</div>

</body>
</html>
